version: 1
backend: franky

dataset:
  root: datacollection/franka_robotiq_single_left/rollout_dataset_franky_31d
  task: Place the white lid firmly onto the jig.
  fps: 30
  image_size: [224, 224]

transport:
  socket_path: /tmp/evo_rlt_franka_single_left_31d.sock
  joy_socket_path: /tmp/evo_rlt_franka_single_left_31d_joy.sock

control:
  gamepad_profile: sft_record
  sync_tolerance_ms: 100
  policy_timeout_s: 30.0
  rtc_deployment_config: ../../../src/evo_rlt/configs/deployment/franka_single_left_pi05_rtc.yaml
  damping: 0.05
  max_joint_speed: 0.30
  joint_limit_margin: 0.05
  gamepad_control_rate: 100
  gamepad_joy_timeout_s: 0.20
  gamepad_state_timeout_s: 0.50
  gamepad_deadzone: 0.08
  gamepad_xy_speed: 0.02
  gamepad_z_speed: 0.01
  gamepad_tilt_speed: 0.15
  gamepad_roll_speed: 0.30
  gamepad_gripper_speed: 0.40
  policy_gripper_speed: 1.0
  gamepad_gripper_trigger_deadzone: 0.05
  gamepad_position_gain: 8.0
  gamepad_orientation_gain: 3.0
  gamepad_max_angular_speed: 0.30
  min_control_command_success_rate: 0.90
  low_success_rate_samples: 3

robot:
  address: 192.168.1.11
  arm_id: left

cameras:
  - name: base
    serial: "260722303785"
  - name: left_wrist
    serial: "346222073620"

force_observation:
  format: 31d
  source: Franky/libfranka RobotState
  fields:
    - state_10d
    - tau_J
    - tau_ext_hat_filtered
    - dq
